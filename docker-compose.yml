services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bedmanager
      POSTGRES_PASSWORD: bedmanager
      POSTGRES_DB: bedmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "13377:13377"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bedmanager:bedmanager@db:5432/bedmanager
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
